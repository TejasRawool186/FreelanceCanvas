services:
  freelance-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelance_canvas_desk
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8010
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local Ollama inference service (start with: docker compose --profile with-ollama up)
  ollama:
    image: ollama/ollama:latest
    container_name: freelance_canvas_ollama
    profiles:
      - with-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
